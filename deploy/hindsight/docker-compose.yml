# Hindsight 部署配置 - 中文优化版
# 使用方式：cd deploy/hindsight && docker compose up -d

version: "3.8"

services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: crawclaw-hindsight
    restart: unless-stopped
    ports:
      - "8888:8888"  # API 端口
      - "9999:9999"  # Web UI 端口
    env_file:
      - .env
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  hindsight-data:
    driver: local
