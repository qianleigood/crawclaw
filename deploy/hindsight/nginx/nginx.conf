worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- 日志格式 ---
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json;

    # --- 限流 ---
    # API 限流：每 IP 每秒 20 请求（burst 允许短时突发）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    # Recall 限流：每 IP 每秒 5 请求（recall 较重）
    limit_req_zone $binary_remote_addr zone=recall_limit:10m rate=5r/s;
    # Retain 限流：每 IP 每秒 10 请求
    limit_req_zone $binary_remote_addr zone=retain_limit:10m rate=10r/s;

    # --- 上游 ---
    upstream hindsight_api {
        server hindsight:8888;
        keepalive 16;
    }

    # --- HTTP → HTTPS 重定向 ---
    server {
        listen 80;
        server_name _;

        location /health {
            proxy_pass http://hindsight_api/health;
            access_log off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS ---
    server {
        listen 443 ssl http2;
        server_name hindsight.your-domain.com;

        # TLS 证书
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全头
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 请求体限制
        client_max_body_size 10m;

        # --- API 端点 ---
        location /v1/ {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_pass http://hindsight_api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 超时
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        # --- Recall 端点（较重，单独限流）---
        location ~ ^/v1/.*/recall$ {
            limit_req zone=recall_limit burst=10 nodelay;

            proxy_pass http://hindsight_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 120s;
        }

        # --- Retain 端点 ---
        location ~ ^/v1/.*/memories$ {
            limit_req zone=retain_limit burst=20 nodelay;

            proxy_pass http://hindsight_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        # --- 健康检查 ---
        location /health {
            proxy_pass http://hindsight_api/health;
            access_log off;
        }

        # --- 指标（仅内网）---
        location /metrics {
            allow 172.28.0.0/16;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://hindsight_api:9090/metrics;
        }

        # --- 默认拒绝 ---
        location / {
            return 404;
        }
    }
}
