# Hindsight 部署配置 - 中文优化版
# 使用方式：cd deploy/hindsight && docker compose up -d

services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: crawclaw-hindsight
    restart: unless-stopped
    ports:
      - "${HINDSIGHT_API_PORT:-8888}:${HINDSIGHT_API_PORT:-8888}"  # API 端口
      - "${HINDSIGHT_WEB_PORT:-9999}:9999"  # Web UI 端口
    env_file:
      - .env
    volumes:
      - hindsight-data:/home/hindsight/.pg0
      - hindsight-model-cache:/home/hindsight/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${HINDSIGHT_API_PORT:-8888}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  hindsight-data:
    driver: local
  hindsight-model-cache:
    driver: local
