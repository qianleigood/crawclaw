[package]
name = "crawclaw-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crawclaw-native-plugins = { path = "../crawclaw-native-plugins" }
crawclaw-plugin-sdk = { path = "../crawclaw-plugin-sdk" }
crawclaw-providers = { path = "../crawclaw-providers" }
crawclaw-runtime = { path = "../crawclaw-runtime" }
futures-util = "0.3"
regex = "1"
ring = "0.17"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tracing = "0.1"
