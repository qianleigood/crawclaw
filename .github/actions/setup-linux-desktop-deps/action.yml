name: Setup Linux desktop dependencies
description: Install Ubuntu packages required by Tauri and GTK desktop crates.
runs:
  using: composite
  steps:
    - name: Install desktop system packages
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libayatana-appindicator3-dev \
          libglib2.0-dev \
          libgtk-3-dev \
          librsvg2-dev \
          libsoup-3.0-dev \
          libwebkit2gtk-4.1-dev \
          pkg-config
