[package]
name = "crawclaw-desktop"
version = "2026.5.3"
description = "CrawClaw Tauri desktop application"
authors = ["CrawClaw"]
license = "MIT"
edition = "2021"

[lib]
name = "crawclaw_desktop"
path = "src/lib.rs"

[[bin]]
name = "crawclaw-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
crawclaw-core = { path = "../../../crates/crawclaw-core" }
crawclaw-gateway = { path = "../../../crates/crawclaw-gateway" }
crawclaw-native-plugins = { path = "../../../crates/crawclaw-native-plugins" }
crawclaw-plugin-host = { path = "../../../crates/crawclaw-plugin-host" }
crawclaw-providers = { path = "../../../crates/crawclaw-providers" }
crawclaw-runtime = { path = "../../../crates/crawclaw-runtime" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
