[package]
name = "crawclaw-repo-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crawclaw-native-plugins = { path = "../crawclaw-native-plugins" }
crawclaw-providers = { path = "../crawclaw-providers" }
crawclaw-runtime = { path = "../crawclaw-runtime" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
