[package]
name = "crawclaw-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "crawclaw"
path = "src/main.rs"

[dependencies]
crawclaw-gateway = { path = "../crawclaw-gateway" }
crawclaw-native-plugins = { path = "../crawclaw-native-plugins" }
crawclaw-plugin-host = { path = "../crawclaw-plugin-host" }
crawclaw-providers = { path = "../crawclaw-providers" }
crawclaw-runtime = { path = "../crawclaw-runtime" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
