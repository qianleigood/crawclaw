[package]
name = "crawclaw-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crawclaw-core = { path = "../crawclaw-core" }
crawclaw-channels = { path = "../crawclaw-channels" }
crawclaw-native-plugins = { path = "../crawclaw-native-plugins" }
crawclaw-plugin-sdk = { path = "../crawclaw-plugin-sdk" }
crawclaw-providers = { path = "../crawclaw-providers" }
async-trait = "0.1"
asupersync = "0.3.1"
chrono = "0.4"
chrono-tz = "0.10.4"
croner = "3.0.1"
futures = "0.3"
pi = { package = "pi_agent_rust", version = "0.1.13", default-features = false }
jsonschema = "0.33"
pdf-extract = "0.10.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
